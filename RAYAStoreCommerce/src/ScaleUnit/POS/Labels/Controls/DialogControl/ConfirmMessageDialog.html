<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Confirmation Dialog</title>
    <link rel="stylesheet" href="AddLabelDialogStyles.min.css" />
</head>
<body>
    <!-- HTMLLint Disable LabelExistsValidator -->
    <div class="sampleExtension_dialogSample col grow">        
        <div>
            <h4><span data-bind="text: confirmMessage"></span></h4>
        </div>
        <div>
            <h5><span ></span></h5>
        </div>
        <div class="grow"></div>
        <div class="col" data-bind="visible: visibleReprint">
            <button class="primaryButton stretch" data-bind="click: reprintClickHandler">
                <span data-bind="text: context.resources.getString('REPRINT_BUTTON_TXT')"></span>
            </button>
        </div>
    </div>
</body>
</html>
