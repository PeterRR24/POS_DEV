<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Add Label Dialog</title>
    <link rel="stylesheet" href="AddLabelDialogStyles.min.css" />
</head>
<body>
    <!-- HTMLLint Disable LabelExistsValidator -->
    <div class="sampleExtension_dialogSample col grow">
        <div data-bind="visible: showLabelType">
            <div class="marginTop12 marginBottom12" style="display: block;">
                <h3 class="secondaryFontColor" data-bind="text: context.resources.getString('ITEM_LABEL_TYPE')"></h3>
            </div>
            <div class="grow">
                <div class="row padLeft8 marginTop8">
                    <label>
                    <input type="radio" style="display:inline-block !important" class="marginRight4" value="1" data-bind="checked: selectedLabelType, click: enableOk" />
                        <!--ko text: context.resources.getString('PRODUCT_LABEL') --><!--/ko-->
                    </label>
                </div>
                <div class="row padLeft8 marginTop8">
                    <label><input type="radio" style="display:inline-block !important" class="marginRight4" value="3" data-bind="checked: selectedLabelType, click: enableOk" />
                        <!--ko text: context.resources.getString('SHELF_LABEL') --><!--/ko-->
                    </label>
                </div>
            </div>
        </div>
        <div data-bind="visible: showLabelType">
            <div class="marginTop12 marginBottom12" style="display: block;">
                <h3 class="secondaryFontColor" data-bind="text: context.resources.getString('LABEL_CODE')"></h3>
            </div>
            <div>
                <select data-bind="options: labelCodes,
                optionsText: function(item) { return item.Code + ' : ' + item.Description },
                value: selectedCode, optionsCaption: context.resources.getString('OPTIONS_CAPTION_TEXT')"></select>
            </div>
        </div>
        <div data-bind="visible: showLabelType">
            <div class="marginTop12 marginBottom12" style="display: block;">
                <h3 class="secondaryFontColor" data-bind="text: context.resources.getString('PRICE_DATE')"></h3>                
            </div>
            <div class="dialog-date-panel">
                <div class="dialog-date-picker">
                    <div id="divPriceDate"></div>
                </div>
            </div>
            <div class="marginTop12 marginBottom12" data-bind="visible: (showLabelType && showQuantity)">
                <label>
                    <!--ko text: context.resources.getString('PRINT_LABEL_QTY_DIALOG_NOTE') --><!--/ko-->
                </label>
            </div>
        </div>
        <div data-bind="visible: showQuantity">
            <div class="marginTop12 marginBottom12">
                <h4 data-bind="text: context.resources.getString('ENTER_QUANTITY')"></h4>
            </div>
            <div>
                <input type="text" data-bind="value: userEnteredValue, valueUpdate: 'afterkeydown'" />
            </div>
        </div>        
        <div class="grow"></div>
        
    </div>
</body>
</html>
