<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>ClearCommitOptions Dialog</title>
    <link rel="stylesheet" href="ClearCommitOptionsDialogStyle.css" />
</head>
<body>
    <!-- HTMLLint Disable LabelExistsValidator -->
    <div class="sampleExtension_dialogSample col grow">        
        <div class="marginTop12 marginBottom12">
            <h3 class="secondaryFontColor wrapText" data-bind="text: message">Select option</h3>
        </div>
        <div class="dialog-option grow">
            <div class="row padLeft12 marginTop8">
                <label><input type="radio" class="marginRight4" value="1" data-bind="checked: optionValue, enable: (shelf != '')"/>
                    <!-- ko text: context.resources.getString('OPTION_SELECTED_SHELF') --><!-- /ko --></label>
            </div>
            <div class="row padLeft12 marginTop8">
                <label><input type="radio" class="marginRight4" value="2" data-bind="checked: optionValue, enable: (shelf != '')"/>
                    <!-- ko text: context.resources.getString('OPTION_SELECTED_SECTION') --><!-- /ko --></label>
            </div>
            <div class="row padLeft12 marginTop8">
                <label><input type="radio" class="marginRight4" value="3" data-bind="checked: optionValue"/>
                    <!-- ko text: context.resources.getString('OPTION_ALL_SECTIONS') --><!-- /ko --></label>
            </div>
        </div>
        <div class="grow"></div>
    </div>
</body>
</html>
